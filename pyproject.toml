[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simgen"
version = "0.3.1"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rokas Elijošius", email = "re344@cam.ac.uk" }]
dependencies = [
    "ase==3.29.0",
    "einops==0.8.2",
    "fire==0.7.1",
    "frozendict==2.4.7",
    "typer==0.27.2",
    "decorator==5.3.1",
    "mace-models==0.1.6",
    "mace-torch==0.3.16",
    "hydromace==0.2.1",
    "znframe==0.1.5",
    "zndraw==0.6.0",
    "e3nn==0.4.4",
    "torch>=2.0",
    "numpy==1.26.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simgen", "energy_model", "simgen_zndraw", "airss_baseline"]
namespaces = false

[project.scripts]
simgen = "simgen_zndraw.cli:cli_app"

[project.optional-dependencies]
all = [
    "rdkit==2026.3.5"
]

[tool.ruff]
lint.select = ["I", "UP", "F", "E", "W", "C90", "B", "A", "RUF"]
lint.ignore = ["E501", "B008", "E731"]
lint.exclude = ["airss_baseline/*", "energy_model/*", "simgen/sascrorer.py"]
